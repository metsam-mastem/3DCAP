name: 3DCAP Capture Core

on:
  push:
    branches: [main, "feat/capture-core-mvp-v0.1"]
    paths:
      - "core/capture/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/capture-core.yml"
  pull_request:
    paths:
      - "core/capture/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/capture-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run capture core unit tests
        run: gradle --no-daemon test
